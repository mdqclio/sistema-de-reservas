name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Tests del motor de precios (standalone, sin npm install).
      - name: Tests de precios
        run: node tests/precios.test.mjs

      # Verifica que today() use fecha local (no UTC) — bug de caja nocturna.
      - name: Test today() local
        run: node tests/today.test.mjs

      # Barreras de contabilidad: R-05 (doble emisión de facturas) y las guardas
      # del contraasiento (qué movimiento se puede revertir).
      - name: Tests de contabilidad
        run: node tests/contabilidad.test.mjs

      # Formato de montos de la grilla: fmtPrecioCorto con moneda (ARS/USD),
      # nunca float crudo ni más de 2 decimales.
      - name: Tests de formato (fmtPrecioCorto)
        run: node tests/fmt.test.mjs

      # Grilla: saldo único (saldoReserva) y posición de las barras de medio día.
      - name: Tests de grilla (saldo + barras)
        run: node tests/grilla.test.mjs

      # Cálculo inverso: total pactado → precio manual por noche (total guardado = escrito).
      - name: Tests de total pactado
        run: node tests/total.test.mjs

      # Grupos: reparto exacto de un pago, 1 movimiento por reserva, alta de N
      # reservas con el mismo grupoId y cancelar una sin tocar las otras.
      - name: Tests de grupos
        run: node tests/grupos.test.mjs

      # Chequeo de sintaxis del <script type="module"> de index.html
      # (mismo patrón que docs/START SESSION.md).
      - name: Sintaxis de index.html
        run: |
          node --input-type=module << 'EOF'
          import { readFileSync, writeFileSync } from 'fs';
          const c = readFileSync('index.html', 'utf8');
          const s = c.indexOf('<script type="module">');
          const e = c.lastIndexOf('</script>');
          writeFileSync('/tmp/t.mjs', c.slice(s + 22, e));
          EOF
          node --check /tmp/t.mjs
